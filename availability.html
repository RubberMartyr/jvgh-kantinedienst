<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JVGH – Beschikbaarheid</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#002b5c" />
  <meta name="application-name" content="JVGH Kantineplanning" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JVGH Planning" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./pwa.css" />
  <script>
    (function () {
      const storageKey = "jvgh_access_granted";
      let saved = null;

      try {
        saved = JSON.parse(localStorage.getItem(storageKey) || "null");
      } catch (err) {
        localStorage.removeItem(storageKey);
      }

      if (saved && saved.granted && saved.expires > Date.now()) {
        return;
      }

      if (saved) {
        localStorage.removeItem(storageKey);
      }

      document.documentElement.classList.add("jvgh-access-locked");
    })();
  </script>
  <style>
    .availability-wrap {
      max-width: 900px;
      margin: 20px auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
    }

    .availability-meta {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #374151;
    }

    .availability-month {
      font-size: 30px;
      line-height: 1.1;
      font-weight: 700;
      color: #1f2937;
    }

    .availability-month small {
      font-size: 18px;
      font-weight: 500;
      color: #4b5563;
    }

    .availability-month-nav {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .availability-month-btn {
      border: 1px solid #0f172a;
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .availability-month-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .availability-status {
      margin: 10px 0 14px;
      color: #4b5563;
      font-size: 22px;
      font-weight: 600;
    }

    .availability-month-unavailable {
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #f9fafb;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }

    .availability-month-unavailable input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .availability-save-wrap {
      display: flex;
      justify-content: stretch;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .availability-actions-wrap {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .availability-actions-wrap.hidden {
      display: none;
    }

    .availability-save-wrap.hidden {
      display: none;
    }

    .availability-calendar-btn {
      min-height: 56px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 12px;
      border: 2px solid #14532d;
      background: #15803d;
      color: #fff;
      cursor: pointer;
      padding: 10px 20px;
      box-shadow: 0 4px 10px rgba(21, 128, 61, 0.3);
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }

    .availability-calendar-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(21, 128, 61, 0.4);
    }

    .availability-calendar-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .availability-save-btn {
      flex: 1;
      min-height: 56px;
      font-size: 28px;
      font-weight: 800;
      border-radius: 12px;
      border: 2px solid #0a2749;
      background: #0f3467;
      color: #fff;
      cursor: pointer;
      padding: 10px 24px;
      box-shadow: 0 4px 10px rgba(15, 52, 103, 0.35);
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }

    .availability-save-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(15, 52, 103, 0.45);
    }

    .availability-save-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .availability-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .availability-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      border: 1px solid #f3f4f6;
      border-left: 5px solid #dc2626;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff7f7;
    }

    .availability-item-empty {
      border-left-color: #dc2626;
      background: #fff7f7;
    }

    .availability-item-partial {
      border-left-color: #f59e0b;
      background: #fffaf0;
    }

    .availability-item-full {
      border-left-color: #16a34a;
      background: #f0fdf4;
    }

    .availability-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .availability-item-main {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 14px;
    }

    .availability-type-match {
      border-left: 4px solid #28a745;
    }

    .availability-type-event {
      border-left: 4px solid #ff8c00;
    }

    .availability-type-rental {
      border-left: 4px solid #007bff;
    }

    .availability-type-board {
      border-left: 4px solid #800080;
    }

    .availability-source-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.12);
    }

    .availability-expand-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #1e3a8a;
      border-radius: 999px;
      width: 26px;
      height: 26px;
      font-weight: 700;
      cursor: pointer;
    }

    .availability-details {
      grid-column: 1 / -1;
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #fff;
      border: 1px dashed #d1d5db;
      font-size: 13px;
      color: #374151;
      display: none;
    }

    .availability-details.is-open {
      display: block;
    }

    .availability-details ul {
      margin: 6px 0 0 18px;
      padding: 0;
    }

    .availability-error {
      color: #b91c1c;
      font-weight: 600;
    }

    #availability-save-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: #28a745;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 999999;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    #availability-save-toast.is-visible {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(0);
    }

    #availability-save-toast.is-error {
      background: #dc3545;
    }


    @media (max-width: 640px) {
      #availability-save-toast {
        width: calc(100vw - 24px);
        bottom: 16px;
        font-size: 14px;
        padding: 13px 16px;
      }
    }


    /* Availability-specific responsive layout; desktop rules above remain unchanged. */
    @media (max-width: 1199px) {
      .availability-wrap { width: 100%; margin-block: 14px; }
      .availability-item-main, .availability-meta { min-width: 0; overflow-wrap: anywhere; }
    }

    @media (max-width: 767px) {
      .jvgh-main {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .availability-wrap { margin: 10px auto; padding: 14px; border-radius: 10px; }
      .availability-month { font-size: clamp(24px, 8vw, 30px); overflow-wrap: anywhere; }
      .availability-status { font-size: 18px; overflow-wrap: anywhere; }
      .availability-month-nav, .availability-actions-wrap { flex-wrap: wrap; }
      .availability-month-btn, .availability-calendar-btn, .availability-save-btn {
        min-width: 44px;
        min-height: 44px;
      }
      .availability-month-btn { flex: 1 1 180px; font-size: 14px; }
      .availability-calendar-btn, .availability-save-btn { width: 100%; font-size: 18px; }
      .availability-month-unavailable { align-items: flex-start; min-height: 44px; overflow-wrap: anywhere; }
      .availability-month-unavailable input[type="checkbox"],
      .availability-item input[type="checkbox"] { width: 24px; height: 24px; flex: 0 0 24px; }
      .availability-item { grid-template-columns: 24px minmax(0, 1fr) 44px; align-items: start; padding: 12px 10px; }
      .availability-item-main { align-items: flex-start; }
      .availability-expand-btn { width: 44px; height: 44px; }
      #availability-save-toast {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: auto;
        max-width: none;
        transform: translateY(20px);
      }
      #availability-save-toast.is-visible { transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .availability-calendar-btn, .availability-save-btn, #availability-save-toast {
        transition: none;
      }
    }
  </style>
</head>
<body>
<div id="pwa-offline-banner" class="pwa-banner" role="status" aria-live="polite" hidden>
  Geen internetverbinding. Live gegevens en verzending zijn tijdelijk niet beschikbaar.
</div>
<div id="pwa-update-banner" class="pwa-banner pwa-update-banner" role="status" aria-live="polite" hidden>
  <span>Er is een nieuwe versie beschikbaar.</span>
  <button id="pwa-update-button" type="button">Bijwerken</button>
</div>
<header class="jvgh-header">
  <div class="jvgh-header-left">
    <img
      src="./icons/jvgh-logo.jpg"
      alt="Jeugd Herk – JVGH"
      class="jvgh-logo"
    />
    <div class="jvgh-header-text">
      <div class="jvgh-header-title">JVGH – Beschikbaarheid</div>
      <div class="jvgh-header-subtitle">
        Vink shifts aan om de gebruiker automatisch in te plannen.
      </div>
    </div>
  </div>
  <div class="jvgh-header-tag">Intern clubgebruik</div>
</header>

<main class="jvgh-main">
  <section class="availability-wrap">
    <div class="availability-meta" id="availability-meta"></div>
    <div class="availability-status" id="availability-status" role="status" aria-live="polite">Laden…</div>
    <label class="availability-month-unavailable" for="availability-month-unavailable-checkbox">
      <input type="checkbox" id="availability-month-unavailable-checkbox" />
      Ik ben niet beschikbaar deze maand
    </label>
    <div class="availability-actions-wrap hidden">
      <button id="availability-add-calendar" class="availability-calendar-btn">Download mijn kantinediensten (.ics)</button>
    </div>
    <div class="availability-save-wrap hidden">
      <button id="availability-save-top" class="availability-save-btn" disabled>Opslaan</button>
    </div>
    <ul id="availability-list" class="availability-list"></ul>
    <div class="availability-save-wrap hidden">
      <button id="availability-save-bottom" class="availability-save-btn" disabled>Opslaan</button>
    </div>
  </section>
</main>

<script src="jvgh-api.js"></script>
<script src="jvgh-access-control.js"></script>
<script>
  JVGHAccessControl.mount({
    title: "Kantinedienst Planning",
    subtitle: "Voer de toegangscode in",
    buttonText: "Toegang verkrijgen"
  });
</script>
<script src="availability.js"></script>
<script src="pwa.js"></script>
</body>
</html>
